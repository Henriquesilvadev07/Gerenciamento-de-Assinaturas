<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RickSubs™ | Financial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --surface: #141414; --primary: #e50914;
            --text-main: #ffffff; --text-dim: #a3a3a3; --border: #333333;
            --success: #00ff88; --warning: #f1c40f;
        }
        [data-theme="light"] {
            --bg: #f5f5f7; --surface: #ffffff; --text-main: #1d1d1f;
            --text-dim: #86868b; --border: #d2d2d7;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; transition: 0.4s; }
        .container { max-width: 1100px; margin: 0 auto; padding: 15px; animation: fadeInUp 0.6s ease-out; box-sizing: border-box; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 20px; font-weight: 800; }
        .logo span { color: var(--primary); }

        .header-nav { display: flex; gap: 15px; align-items: center; overflow-x: auto; width: 100%; padding-bottom: 5px; justify-content: flex-start; }
        .nav-link { background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; padding: 4px 0; border-bottom: 2px solid transparent; white-space: nowrap; }
        .nav-link:hover, .nav-link.active { color: var(--text-main); border-bottom-color: var(--primary); }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .theme-switch {
            position: relative; width: 46px; height: 24px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; flex-shrink: 0;
        }
        .theme-switch .toggle-circle {
            position: absolute; width: 18px; height: 18px; background: var(--primary); border-radius: 50%; transition: 0.3s; left: 3px;
        }
        [data-theme="light"] .theme-switch .toggle-circle { left: 23px; }

        /* Estilo da Tela de Auth */
        .auth-container { max-width: 400px; margin: 60px auto; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .auth-card h2 { margin-top: 0; font-size: 18px; margin-bottom: 20px; text-align: center; }
        .tab-auth { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; background: none; border: none; padding: 10px; color: var(--text-dim); font-weight: 700; cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--text-main); border-bottom-color: var(--primary); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }

        .user-mini-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .avatar-img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: var(--border); }

        .summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .summary-box { background: var(--surface); padding: 14px; border-radius: 12px; border-left: 4px solid var(--border); }
        .summary-box.debt { border-left-color: var(--primary); }
        .summary-box label { font-size: 8px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
        .summary-box h2 { font-size: 18px; margin: 5px 0 0 0; font-weight: 800; word-break: break-all; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 11px; color: var(--text-dim); }
        .form-control { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); box-sizing: border-box; font-size: 14px; }

        .btn-rick { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 13px; margin-top: 8px; }
        .btn-rick.edit-mode { background: var(--warning); color: #000; }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }

        /* Tabela Otimizada para Celular (Compacta sem precisar arrastar) */
        table { width: 100%; border-collapse: collapse; min-width: unset; table-layout: fixed; }
        th { text-align: left; padding: 10px 6px; font-size: 9px; color: var(--text-dim); border-bottom: 1px solid var(--border); text-transform: uppercase; background: var(--surface); }
        td { padding: 10px 6px; border-bottom: 1px solid var(--border); font-size: 11px; vertical-align: middle; word-break: break-word; }

        /* Ajustes de largura das colunas para encaixar perfeitamente no mobile */
        th:nth-child(1), td:nth-child(1) { width: 28%; } /* Serviço */
        th:nth-child(2), td:nth-child(2) { width: 18%; } /* Vencimento */
        th:nth-child(3), td:nth-child(3) { width: 20%; } /* Valor */
        th:nth-child(4), td:nth-child(4) { width: 18%; } /* Status */
        th:nth-child(5), td:nth-child(5) { width: 16%; text-align: right; } /* Ações */

        .status-dot { height: 5px; width: 5px; border-radius: 50%; display: inline-block; margin-right: 3px; }
        .dot-ATIVO { background: var(--success); }
        .dot-SUSPENSO { background: var(--warning); }
        .dot-CANCELADO { background: var(--primary); }

        .action-cell { text-align: right; white-space: nowrap; }
        .btn-action { background: none; border: none; padding: 2px; margin-left: 2px; cursor: pointer; color: var(--text-dim); transition: 0.2s; display: inline-flex; align-items: center; vertical-align: middle; }
        .btn-action:hover { color: var(--text-main); }
        .btn-action svg { width: 14px; height: 14px; fill: currentColor; }

        footer { margin-top: 25px; padding: 15px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; gap: 10px; }
        .tech-badge { background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 9px; }
        .error-msg { color: var(--primary); font-size: 11px; margin-top: 8px; text-align: center; display: none; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Estilos específicos para Desktop (A partir de 768px) */
        @media (min-width: 768px) {
            .container { padding: 40px 20px; }
            header { flex-wrap: nowrap; margin-bottom: 40px; }

            /* Centraliza as opções do menu no desktop */
            .header-nav { justify-content: center; width: auto; overflow-x: visible; }

            .summary-row { gap: 15px; margin-bottom: 20px; }
            .summary-box { padding: 16px; }
            .summary-box h2 { font-size: 26px; }
            .summary-box label { font-size: 10px; }

            /* Restaura o layout expandido e confortável da tabela no desktop */
            table { min-width: 450px; table-layout: auto; }
            th { padding: 12px 10px; font-size: 10px; }
            td { padding: 12px 10px; font-size: 12px; }
            th:nth-child(1), td:nth-child(1),
            th:nth-child(2), td:nth-child(2),
            th:nth-child(3), td:nth-child(3),
            th:nth-child(4), td:nth-child(4),
            th:nth-child(5), td:nth-child(5) { width: auto; }

            .status-dot { height: 6px; width: 6px; margin-right: 5px; }
            .btn-action { padding: 4px; margin-left: 6px; }
            .btn-action svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body data-theme="dark">

<!-- TELA DE AUTENTICAÇÃO -->
<div id="authScreen" class="container auth-container">
    <header style="justify-content: center; margin-bottom: 20px;">
        <div class="logo">RICK<span>SUBS.</span></div>
    </header>
    <div class="auth-card">
        <div class="tab-auth">
            <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Entrar</button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Cadastrar</button>
        </div>

        <div id="formLogin">
            <h2>Acessar Painel</h2>
            <div class="form-group"><label>E-mail</label><input type="email" id="loginEmail" class="form-control"></div>
            <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" class="form-control"></div>
            <div id="loginError" class="error-msg"></div>
            <button type="button" class="btn-rick" onclick="fazerLogin()">Entrar</button>
        </div>

        <div id="formRegister" style="display: none;">
            <h2>Criar Conta</h2>
            <div class="form-group"><label>E-mail</label><input type="email" id="regEmail" class="form-control"></div>
            <div class="form-group"><label>Senha</label><input type="password" id="regSenha" class="form-control"></div>
            <div id="regError" class="error-msg"></div>
            <button type="button" class="btn-rick" onclick="fazerCadastro()">Cadastrar e Entrar</button>
        </div>
    </div>
</div>

<!-- DASHBOARD PRINCIPAL -->
<div id="dashboardScreen" class="container" style="display: none;">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo">RICK<span>SUBS.</span></div>
            <div class="header-right">
                <div class="user-mini-profile" onclick="switchView('perfil')" title="Editar Perfil">
                    <img id="headerAvatar" src="https://via.placeholder.com/30" class="avatar-img" alt="Avatar">
                    <span id="headerName" style="font-size: 12px; font-weight: 600; display: none; @media(min-width: 500px){display:inline;}">Usuário</span>
                </div>
                <div class="theme-switch" onclick="toggleTheme()" title="Mudar Tema"><span>🌙</span><span>☀️</span><div class="toggle-circle"></div></div>
            </div>
        </div>
        <div class="header-nav">
            <button class="nav-link active" onclick="switchView('dashboard')" id="navDashboard">Visão Geral</button>
            <button class="nav-link" onclick="switchView('cadastrar')" id="navCadastrar">Novo Serviço</button>
            <button class="nav-link" onclick="switchView('perfil')" id="navPerfil">Perfil</button>
        </div>
    </header>

    <!-- SEÇÃO 1: VISÃO GERAL -->
    <div id="view-dashboard" class="view-section active">
        <div class="summary-row">
            <div class="summary-box"><label>Total Mensal</label><h2 id="totalValor">R$ 0,00</h2></div>
            <div class="summary-box debt"><label>Suspenso / Cancelado</label><h2 id="totalAtraso" style="color: var(--primary);">R$ 0,00</h2></div>
        </div>
        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-responsive">
                <table>
                    <thead><tr><th>Serviço</th><th>Venc.</th><th>Valor</th><th>Status</th><th style="text-align: right; padding-right: 6px;">Ações</th></tr></thead>
                    <tbody id="tabelaCorpo"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SEÇÃO 2: NOVO / EDITAR SERVIÇO -->
    <div id="view-cadastrar" class="view-section">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h3 id="formTitle" style="margin: 0 0 20px 0; font-size: 16px;">Registrar Nova Assinatura</h3>
            <input type="hidden" id="assinaturaId">
            <div class="form-group"><label>Serviço</label><input type="text" id="servico" class="form-control" placeholder="Ex: Netflix"></div>
            <div class="form-group"><label>Valor (R$)</label><input type="number" id="valor" class="form-control" placeholder="0.00"></div>
            <div class="form-group"><label>Vencimento</label><select id="dataVencimento" class="form-control"></select></div>
            <div class="form-group"><label>Status</label>
                <select id="status" class="form-control">
                    <option value="ATIVO">Ativo</option><option value="SUSPENSO">Suspenso</option><option value="CANCELADO">Cancelado</option>
                </select>
            </div>
            <div class="form-group"><label>Plano</label><input type="text" id="plano" class="form-control" placeholder="Ex: Premium 4K"></div>
            <button type="button" id="btnSubmit" class="btn-rick" onclick="handleSalvar()">Salvar Assinatura</button>
            <button type="button" id="btnCancelar" class="btn-rick" style="display:none; background:none; border:1px solid var(--border); margin-top: 10px;" onclick="resetForm(); switchView('dashboard')">Cancelar</button>
        </div>
    </div>

    <!-- SEÇÃO 3: PERFIL E CONFIGURAÇÕES -->
    <div id="view-perfil" class="view-section">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h3 style="margin: 0 0 20px 0; font-size: 16px;">Personalização de Perfil</h3>
            <div class="form-group">
                <label>Nome de Exibição</label>
                <input type="text" id="inputNomePerfil" class="form-control" placeholder="Seu Nome">
            </div>
            <div class="form-group">
                <label>URL da Foto de Perfil (Avatar)</label>
                <input type="text" id="inputAvatarPerfil" class="form-control" placeholder="https://exemplo.com/sua-foto.jpg">
            </div>
            <button type="button" class="btn-rick" onclick="salvarPerfil()">Salvar Alterações</button>
            <div style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <span style="font-size: 12px; color: var(--text-dim);">Deseja sair da sua conta atual?</span>
                <button type="button" class="btn-rick" style="width: auto; padding: 10px 16px; background: none; border: 1px solid var(--primary); color: var(--primary); margin-top: 0;" onclick="fazerLogout()">Sair da Conta</button>
            </div>
        </div>
    </div>

    <footer>
        <div>Desenvolvido por <span>Henrique Silva de Carvalho</span></div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <span class="tech-badge">Java 21</span><span class="tech-badge">Spring Boot 3</span><span class="tech-badge">PostgreSQL</span>
        </div>
    </footer>
</div>

<script>
    const API_URL = 'http://localhost:8080';
    let editMode = false;

    const iconEdit = `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
    const iconDelete = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

    const select = document.getElementById('dataVencimento');
    for(let i=1; i<=31; i++) { let opt = document.createElement('option'); opt.value = i; opt.innerHTML = `Dia ${i}`; select.appendChild(opt); }

    function switchAuthTab(tab) {
        if(tab === 'login') {
            document.getElementById('tabLoginBtn').classList.add('active'); document.getElementById('tabRegisterBtn').classList.remove('active');
            document.getElementById('formLogin').style.display = 'block'; document.getElementById('formRegister').style.display = 'none';
        } else {
            document.getElementById('tabRegisterBtn').classList.add('active'); document.getElementById('tabLoginBtn').classList.remove('active');
            document.getElementById('formRegister').style.display = 'block'; document.getElementById('formLogin').style.display = 'none';
        }
    }

    function switchView(viewName) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));

        document.getElementById(`view-${viewName}`).classList.add('active');
        if(viewName === 'dashboard') document.getElementById('navDashboard').classList.add('active');
        if(viewName === 'cadastrar') document.getElementById('navCadastrar').classList.add('active');
        if(viewName === 'perfil') {
            document.getElementById('navPerfil').classList.add('active');
            carregarPerfilNaTela();
        }
    }

    window.onload = function() {
        if(localStorage.getItem('token')) {
            mostrarDashboard();
            listar();
            carregarPerfilNaTela();
        } else {
            mostrarAuth();
        }
    };

    function mostrarAuth() { document.getElementById('authScreen').style.display = 'block'; document.getElementById('dashboardScreen').style.display = 'none'; }
    function mostrarDashboard() { document.getElementById('authScreen').style.display = 'none'; document.getElementById('dashboardScreen').style.display = 'block'; }

    function carregarPerfilNaTela() {
        const nome = localStorage.getItem('userName') || localStorage.getItem('userEmail')?.split('@')[0] || 'Usuário';
        const avatar = localStorage.getItem('userAvatar') || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + nome;

        const headerName = document.getElementById('headerName');
        if(headerName) headerName.innerText = nome;
        document.getElementById('headerAvatar').src = avatar;

        document.getElementById('inputNomePerfil').value = localStorage.getItem('userName') || '';
        document.getElementById('inputAvatarPerfil').value = localStorage.getItem('userAvatar') || '';
    }

    function salvarPerfil() {
        const nome = document.getElementById('inputNomePerfil').value;
        const avatar = document.getElementById('inputAvatarPerfil').value;
        if(nome) localStorage.setItem('userName', nome);
        if(avatar) localStorage.setItem('userAvatar', avatar);
        carregarPerfilNaTela();
        switchView('dashboard');
    }

    async function fazerCadastro() {
        const login = document.getElementById('regEmail').value;
        const senha = document.getElementById('regSenha').value;
        try {
            const resp = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ login, senha })
            });
            if(!resp.ok) throw new Error("Erro ao cadastrar");
            alert("Cadastro realizado com sucesso! Faça seu login.");
            switchAuthTab('login');
            document.getElementById('loginEmail').value = login;
            document.getElementById('regEmail').value = '';
            document.getElementById('regSenha').value = '';
        } catch(e) {
            document.getElementById('regError').innerText = "Erro ao cadastrar. Tente outro e-mail.";
            document.getElementById('regError').style.display = 'block';
        }
    }

    function fazerLogout() { localStorage.clear(); mostrarAuth(); }

    async function listar() {
        const token = localStorage.getItem('token');
        try {
            const resp = await fetch(`${API_URL}/assinaturas`, { headers: { 'Authorization': `Bearer ${token}` } });
            if(resp.status === 401 || resp.status === 403) { fazerLogout(); return; }
            const dados = await resp.json();
            let corpo = document.getElementById('tabelaCorpo'), tMensal = 0, tAtraso = 0, html = "";
            dados.forEach(a => {
                if(a.status === 'ATIVO') tMensal += a.valor;
                if(a.status === 'SUSPENSO' || a.status === 'CANCELADO') tAtraso += a.valor;
                html += `<tr><td><div>${a.servico}</div></td><td>Dia ${a.dataVencimento}</td><td>R$ ${a.valor.toFixed(2)}</td><td><span class="status-dot dot-${a.status}"></span>${a.status}</td><td class="action-cell"><button class="btn-action" onclick='prepEdit(${JSON.stringify(a)})'>${iconEdit}</button><button class="btn-action" onclick="deletar(${a.id})">${iconDelete}</button></td></tr>`;
            });
            corpo.innerHTML = html;
            document.getElementById('totalValor').innerText = `R$ ${tMensal.toFixed(2)}`;
            document.getElementById('totalAtraso').innerText = `R$ ${tAtraso.toFixed(2)}`;
        } catch(e) {}
    }

    async function fazerLogin() {
        const login = document.getElementById('loginEmail').value;
        const senha = document.getElementById('loginSenha').value;
        try {
            const resp = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ login, senha })
            });
            if(!resp.ok) throw new Error("Credenciais inválidas");
            const data = await resp.json();

            const token = typeof data === 'string' ? data : (data.token || data.accessToken);
            localStorage.setItem('token', token);
            localStorage.setItem('userEmail', login);
            if (data.id) localStorage.setItem('usuarioId', data.id);
            if (data.usuarioId) localStorage.setItem('usuarioId', data.usuarioId);

            mostrarDashboard();
            listar();
            carregarPerfilNaTela();
        } catch(e) {
            document.getElementById('loginError').innerText = "Usuário inexistente ou senha inválida.";
            document.getElementById('loginError').style.display = 'block';
        }
    }

    async function handleSalvar() {
        const dto = {
            servico: document.getElementById('servico').value,
            valor: parseFloat(document.getElementById('valor').value),
            dataVencimento: parseInt(document.getElementById('dataVencimento').value),
            status: document.getElementById('status').value,
            plano: document.getElementById('plano').value,
            usuario: parseInt(localStorage.getItem('usuarioId')) || 1
        };

        const id = document.getElementById('assinaturaId').value;
        const isEdit = editMode && id;

        try {
            const resp = await fetch(isEdit ? `${API_URL}/assinaturas/${id}` : `${API_URL}/assinaturas`, {
                method: isEdit ? 'PUT' : 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify(dto)
            });

            if (!resp.ok) throw new Error("Erro ao salvar");

            resetForm();
            switchView('dashboard');
            listar();
        } catch (e) {
            alert("Erro ao salvar assinatura. Verifique os campos.");
        }
    }

    function prepEdit(o) {
        editMode = true;
        document.getElementById('assinaturaId').value = o.id;
        document.getElementById('servico').value = o.servico;
        document.getElementById('valor').value = o.valor;
        document.getElementById('dataVencimento').value = o.dataVencimento;
        document.getElementById('status').value = o.status;
        document.getElementById('plano').value = o.plano || '';
        document.getElementById('btnSubmit').innerText = "Atualizar Assinatura";
        document.getElementById('btnSubmit').classList.add('edit-mode');
        document.getElementById('btnCancelar').style.display = "block";
        switchView('cadastrar');
    }

    function resetForm() {
        editMode = false;
        document.getElementById('assinaturaId').value = '';
        document.getElementById('servico').value = '';
        document.getElementById('valor').value = '';
        document.getElementById('plano').value = '';
        document.getElementById('btnSubmit').innerText = "Salvar Assinatura";
        document.getElementById('btnSubmit').classList.remove('edit-mode');
        document.getElementById('btnCancelar').style.display = "none";
    }

    async function deletar(id) {
        if(confirm("Remover assinatura?")) {
            await fetch(`${API_URL}/assinaturas/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
            listar();
        }
    }

    function toggleTheme() {
        document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
</script>
</body>
</html>
